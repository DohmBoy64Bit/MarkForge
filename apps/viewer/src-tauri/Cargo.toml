[package]
name = "markforge-viewer"
version = "0.0.0"
description = "MarkForge standalone Markdown viewer foundation"
authors = ["MarkForge contributors"]
edition = "2021"

[lib]
name = "markforge_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.1"
